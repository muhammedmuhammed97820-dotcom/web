<header class="nav glass">
  <a routerLink="/" class="brand" aria-label="المكتبة الإلكترونية">
    <span class="brand-mark"><span>✦</span><span>📚</span></span>
    <span class="brand-copy"><b>المكتبة</b><small>الإلكترونية</small></span>
  </a>

  <nav class="main-nav" aria-label="التنقل الرئيسي">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}"><span>⌂</span> الرئيسية</a>
    <a routerLink="/books" routerLinkActive="active"><span>▣</span> الكتب</a>
    <a routerLink="/categories" routerLinkActive="active"><span>◈</span> التصنيفات</a>
    <a routerLink="/authors" routerLinkActive="active"><span>✎</span> المؤلفون</a>
    <a routerLink="/admin" routerLinkActive="active"><span>⚙</span> الإدارة</a>
  </nav>

  <div class="actions">
    <button class="icon-btn" (click)="themeToggle.emit()" aria-label="تبديل الوضع الليلي"><span>◐</span></button>
    <button class="icon-btn palette" (click)="customize.emit()" aria-label="تخصيص المظهر"><span>✦</span></button>
    <a routerLink="/auth" class="login"><span>دخول</span><b>→</b></a>
  </div>
</header>
